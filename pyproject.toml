[project]
name = "dunecat"
version = "0.1.0"
description = "Locate DUNE data files via metacat queries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "metacat-client>=4.1.4",
    # Direct import in dunecat/mql_lint.py, which parses MQL with metacat's
    # own grammar. Ships transitively with metacat-client today; declared so
    # the hub can't fail to boot if that ever changes.
    "lark>=1.1",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "rucio-clients>=40.1.2",
    "htgettoken>=2.2",
    "cryptography>=42.0",
    "requests>=2.32",
]

[project.scripts]
dunecat = "dunecat.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
